<h2 mat-dialog-title>Adicionar Item</h2>
<mat-dialog-content class="mat-typography">
 <div class="form bg-color-unset">
    <div class="d-flex-column">
      <div class="d-flex-row d-flex-space-between mt-5">
        <div class="d-flex-column" style="width: 100%;">
          <div class="input-form-description">Nome</div>
          <input class="input-form m-0" value="+4"/>
        </div>
      </div>
      <div class="d-flex-row d-flex-space-between mt-5">
        <div class="d-flex-column" style="width: 100%;">
          <div class="input-form-description">Descrição</div>
          <textarea class="input-form m-0" ></textarea>
        </div>
      </div>
      <div class="d-flex-row mt-5">
        <div class="d-flex-column mr-5" style="width: 20%;">
          <div class="input-form-description">Quantidade</div>
          <input class="input-form text-center m-0" value="6m"/>
        </div>
        <div class="d-flex-column ml-5 mr-5" style="width: 20%;">
          <div class="input-form-description">Local</div>
          <input class="input-form text-center m-0" value="Perfurante"/>
        </div>
        <div class="d-flex-column ml-5" style="width: 20%;">
          <div class="input-form-description">Ouro</div>
          <input class="input-form text-center m-0" value="P"/>
        </div>
      </div>
    </div>
</div>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Adicionar</button>
</mat-dialog-actions>
